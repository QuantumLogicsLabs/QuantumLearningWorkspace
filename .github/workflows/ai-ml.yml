name: AI-ML CI

on:
  push:
    paths:
      - "ai-ml/**"
      - ".github/workflows/ai-ml.yml"
  pull_request:
    paths:
      - "ai-ml/**"

jobs:
  isolation-lifecycle-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P1-5 isolation/lifecycle tests
        run: pytest tests -q --tb=short
